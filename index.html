<style>
/* ===== Mobile list sheet: close button + fit above keyboard ===== */
.sheet-close{display:none}
@media (max-width:760px){
  .search-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .search-wrap #search{flex:1;min-width:0}
  .search-wrap #geo-search{flex-basis:100%}
  .sheet-close{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
  .sidebar{height:min(55vh, var(--vvh, 100vh) - 70px);max-height:calc(var(--vvh, 100vh) - 70px)}
  .sidebar::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#cfd6de;margin:8px auto 0}
}
/* ===== automatic translation under a suggestion ===== */
.mt-box{margin:-2px 0 8px;padding:7px 10px;border-inline-start:3px solid var(--blue);background:#f2f9fc;border-radius:0 6px 6px 0}
.mt-box .mt-label{font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.mt-box .mt-text{font-size:.86rem;line-height:1.45;color:var(--ink)}
/* ===== info popup: fits the screen, content scrolls with a finger ===== */
.leaflet-container .leaflet-popup-content{min-width:0;max-width:min(320px, calc(100vw - 72px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.leaflet-container .leaflet-popup-content-wrapper{max-width:calc(100vw - 40px)}
.leaflet-container .leaflet-popup-scrolled{border-top:0;border-bottom:0}
/* ===== sharing ===== */
.share-site{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #2b4c7e;color:#cfe3f7;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.share-site:hover{background:var(--navy-2);color:#fff}
@media (max-width:760px){ .share-site span{display:none} .share-site{padding:7px 9px} }
.pop .share-btn{margin-top:10px;width:100%;background:var(--red);color:#fff;border:1px solid var(--red);padding:6px 10px;font-size:.85rem}
.pop .share-btn + .fix-btn{margin-top:6px}
#share-dlg{border:0;border-radius:14px;padding:0;width:min(440px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
#share-dlg::backdrop{background:rgba(11,37,69,.45)}
#share-dlg .sh-wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#share-dlg .sh-head{display:flex;align-items:center;gap:10px}
#share-dlg .sh-title{margin:0;flex:1;color:var(--navy);font-size:1.1rem}
#share-dlg .sh-x{border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem}

#share-dlg .sh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#share-dlg .sh-net{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;color:#fff;font-weight:700;font-size:.82rem;text-decoration:none;text-align:center;padding:4px}

#share-dlg .sh-copy{display:flex;gap:8px}
#share-dlg .sh-url{flex:1;min-width:0;font:inherit;font-size:.82rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;direction:ltr}

@media (max-width:420px){ #share-dlg .sh-grid{grid-template-columns:repeat(2,1fr)} }

body.admin-open{overflow:hidden}
#admin-view .topbar{position:sticky;top:0;z-index:2}
#admin-view .adm-brand{margin-inline-end:auto}

#admin-view .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#admin-view .grid input,#admin-view .grid textarea,#admin-view .grid select{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
#admin-view .mini{height:200px;border-radius:8px}
#admin-view .meta{font-size:.75rem;color:var(--muted);margin-bottom:6px}
#admin-view .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#admin-view .btn.ok{background:var(--green);color:#fff;border-color:var(--green)} #admin-view .btn.no{background:#fff;color:var(--red);border-color:var(--red)}
#admin-view .st{font-weight:700;text-transform:uppercase;font-size:.7rem}

.topbar .brand{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style>

<script>
/* Popup defaults (set before app.js creates any popup):
   limited height so long content scrolls inside it, and kept clear of the map buttons on phones */
(function () {
  if (!window.L || !L.Popup) return;
  var w = window.innerWidth, h = window.innerHeight, small = w <= 760;
  L.Popup.mergeOptions({
    maxHeight: Math.round(small ? Math.min(h * 0.5, h - 330) : h * 0.7),
    autoPanPaddingTopLeft: L.point(small ? 8 : 12, small ? 84 : 12),
    autoPanPaddingBottomRight: L.point(small ? 8 : 12, small ? 90 : 24),
    keepInView: true
  });
  // let index.html add its own buttons to a popup BEFORE Leaflet measures and positions it
  window.__popupHooks = [];
  var origUpdate = L.Popup.prototype._updateContent;
  L.Popup.prototype._updateContent = function () {
    origUpdate.apply(this, arguments);
    var n = this._contentNode;
    if (!n) return;
    n.__popup = this;
    var pop = n.querySelector(".pop");
    if (pop) window.__popupHooks.forEach(function (f) { try { f(pop); } catch (e) {} });
  };
  // re-fit a popup whose content grew later (e.g. a translation arrived)
  window.__refitPopup = function (el) {
    var n = el && el.closest && el.closest(".leaflet-popup-content"), lp = n && n.__popup;
    if (!lp || !lp._map) return;
    try { lp._updateLayout(); lp._updatePosition(); lp._adjustPan(); } catch (e) {}
  };
})();
</script>

<script>
/* ===== Runs BEFORE app.js: choose the start language =====
   Priority: ?lang=  >  language the visitor clicked in this browser session  >  language from country (IP)
   The country result is cached so the right language appears immediately on later visits. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var manual = sessionStorage.getItem("langManual");
    var geo = localStorage.getItem("geoLang");
    if (!q) localStorage.setItem("lang", manual || geo || "en");
  } catch (e) {}
  // shared links use ?place=ID (survives every social network); app.js opens #place=ID
  try {
    var sp = new URLSearchParams(location.search), pl = sp.get("place");
    if (pl && !/place=/.test(location.hash)) {
      sp.delete("place");
      var qs = sp.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + "#place=" + encodeURIComponent(pl));
    }
  } catch (e) {}
})();
</script>
<script src="assets/app.js"></script>
<script>
/* ======================================================================
   Extras kept inside index.html:
   1) language by visitor's country (IP)   2) closable mobile list sheet
   3) suggestions: original text + automatic translation below it
   Add ?debug=1 to the address to see a diagnostic panel.
   ====================================================================== */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var sidebar = $("#sidebar");
  var curLang = function () { return document.documentElement.lang || "en"; };
  var DEBUG = /[?&]debug=1/.test(location.search);
  var dbgBox = null;
  function log() {
    var msg = Array.prototype.slice.call(arguments).join(" ");
    try { console.info("[Adlarimiz]", msg); } catch (e) {}
    if (!DEBUG) return;
    if (!dbgBox) {
      dbgBox = document.createElement("div");
      dbgBox.style.cssText = "position:fixed;z-index:3000;left:8px;bottom:8px;max-width:min(520px,94vw);max-height:40vh;overflow:auto;background:#111;color:#9f9;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;opacity:.92;white-space:pre-wrap";
      document.body.appendChild(dbgBox);
    }
    dbgBox.textContent += msg + "\n";
  }
  function getJSON(url, ms) {
    var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, ms || 3500);
    return fetch(url, { signal: c.signal, cache: "no-store" })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return txt; } });
  }

  /* ---------- 1) Language by visitor's country ---------- */
  (function () {
    var LANG_BY_COUNTRY = { TR: "tr", AZ: "az", IR: "fa" };
    var LANG_BY_TZ = { "Europe/Istanbul": "tr", "Asia/Istanbul": "tr", "Asia/Baku": "az", "Asia/Tehran": "fa" };
    var userClicked = false;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.addEventListener("click", function (e) {
        if (!e.isTrusted) return;                                        // ignore our own programmatic clicks
        userClicked = true;
        try { sessionStorage.setItem("langManual", b.dataset.lang); } catch (x) {}
      });
    });
    var manual = null; try { manual = sessionStorage.getItem("langManual"); } catch (e) {}
    if (new URLSearchParams(location.search).get("lang") || manual) { log("lang: manual/URL choice kept ->", curLang()); return; }

    function apply(lang, why) {
      lang = lang || "en";
      try { localStorage.setItem("geoLang", lang); } catch (e) {}
      log("lang: " + why + " -> " + lang);
      if (userClicked || lang === curLang()) return;
      var btn = document.querySelector('.langs button[data-lang="' + lang + '"]');
      if (btn) { btn.click(); setTimeout(function () { if (window.__adlarimizReopen) window.__adlarimizReopen(); }, 150); }
    }
    var PROVIDERS = [
      ["country.is", "https://api.country.is/", function (j) { return j.country; }],
      ["geojs", "https://get.geojs.io/v1/ip/country.json", function (j) { return j.country; }],
      ["ipapi.co", "https://ipapi.co/country/", function (j) { return String(j).trim(); }],
      ["ipwho.is", "https://ipwho.is/?fields=country_code", function (j) { return j.country_code; }],
      ["cloudflare", "https://www.cloudflare.com/cdn-cgi/trace", function (t) { var m = /loc=([A-Z]{2})/.exec(String(t)); return m && m[1]; }]
    ];
    (function next(i) {
      if (i >= PROVIDERS.length) {
        var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
        return apply(LANG_BY_TZ[tz] || "en", "all IP services failed, time zone " + tz);
      }
      var p = PROVIDERS[i];
      getJSON(p[1]).then(function (j) {
        var cc = p[2](j); if (!cc || !/^[A-Za-z]{2}$/.test(cc)) throw new Error("no country in answer");
        cc = cc.toUpperCase();
        apply(LANG_BY_COUNTRY[cc] || "en", "country " + cc + " via " + p[0]);
      }).catch(function (err) { log("geo: " + p[0] + " failed (" + (err && err.message || err) + ")"); next(i + 1); });
    })(0);
  })();

  /* ---------- 2) Mobile: closable list sheet ---------- */
  (function () {
    var close = function () { sidebar.classList.remove("open"); var s = $("#search"); if (s) s.blur(); };
    $("#sheet-close").addEventListener("click", close);
    $(".map-wrap").addEventListener("pointerdown", function (e) {
      if (sidebar.classList.contains("open") && !e.target.closest("#toggle-list")) close();
    }, true);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    $("#search").addEventListener("keydown", function (e) { if (e.key === "Enter" && window.innerWidth <= 760) e.target.blur(); });
    var setVvh = function () { var h = window.visualViewport ? window.visualViewport.height : window.innerHeight; document.documentElement.style.setProperty("--vvh", h + "px"); };
    setVvh();
    if (window.visualViewport) window.visualViewport.addEventListener("resize", setVvh);
    window.addEventListener("resize", setVvh);
  })();

  /* ---------- 3) Suggestions: keep the original, add a translation under it ---------- */
  (function () {
    var LABEL = { en: "Automatic translation", tr: "Otomatik çeviri", az: "Avtomatik tərcümə", fa: "ترجمهٔ خودکار" };
    var LOADING = { en: "Translating…", tr: "Çevriliyor…", az: "Tərcümə edilir…", fa: "در حال ترجمه…" };
    var WORDS = {
      en: ["the","and","of","was","is","to","in","by","from","its","were","which","after","renamed","name","called","village","town","city","officially","locals","still"],
      tr: ["ve","ile","olarak","için","yapıldı","edildi","değiştirildi","oldu","değil","hâlâ","şimdi","yerel","resmî","resmen","şehir","köy","adını","adıyla","eski","halk","yerine"],
      az: ["və","ilə","kimi","üçün","edilib","olub","adlanır","adlandırılıb","dəyişdirilib","deyil","hələ","indi","yerli","rəsmi","şəhər","kənd","köhnə","xalq","əvəzinə"]
    };
    var cache = {};
    try { cache = JSON.parse(localStorage.getItem("mtCache2") || "{}"); } catch (e) {}

        lblNow: lblNow.replace(/:\s*$/, "").trim(),
        fa: ((pop.querySelector(".fa") || {}).textContent || "").trim(),
        faLatin: faLatin, meta: meta.join(" · "),
        desc: pEl ? pEl.textContent.trim() : "",
        lat: m ? parseFloat(m[1]) : NaN, lng: m ? parseFloat(m[2]) : NaN
      };
    }

    // story preview dialog
    var sdlg = document.createElement("dialog");
    sdlg.id = "story-dlg";
    sdlg.innerHTML = '<div class="st-wrap"><div class="sh-head"><h3 class="sh-title"></h3><button type="button" class="sh-x" aria-label="Close">✕</button></div>' +
      '<div class="st-prev"><span class="st-wait"></span><img alt=""></div><p class="st-hint"></p>' +
      '<div class="st-btns"><button type="button" class="btn st-share"></button><button type="button" class="btn ghost st-dl"></button></div></div>';
    document.body.appendChild(sdlg);
    sdlg.querySelector(".sh-x").onclick = function () { sdlg.close(); };
    sdlg.addEventListener("click", function (e) { if (e.target === sdlg) sdlg.close(); });
    var storyFile = null, storyUrl = null;

    function copyText(t) {
      try { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).catch(function () {}); } catch (e) {}
      try { var i = document.createElement("textarea"); i.value = t; document.body.appendChild(i); i.select(); document.execCommand("copy"); i.remove(); } catch (e) {}
    }
    function openStory(d) {
      copyText(d.url);                                                    // ready for Instagram's "Link" sticker
      var T = ig();
      sdlg.setAttribute("dir", curLang() === "fa" ? "rtl" : "ltr");
      sdlg.querySelector(".sh-title").textContent = T.btn;
      sdlg.querySelector(".st-wait").textContent = T.make;
      sdlg.querySelector(".st-wait").hidden = false;
      var img = sdlg.querySelector("img"); img.hidden = true;
      var canFiles = false;
      try { canFiles = !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "x.png", { type: "image/png" })] })); } catch (e) {}
      var sb = sdlg.querySelector(".st-share"), db = sdlg.querySelector(".st-dl");
      sb.textContent = T.share; sb.hidden = !canFiles; sb.disabled = true;
      db.textContent = "⤓ " + T.dl; db.disabled = true;
      sdlg.querySelector(".st-hint").textContent = canFiles ? T.hintShare : T.hintDl;
      if (dlg.open) dlg.close();
      sdlg.showModal();
      makeStory(d.story).then(function (blob) {
        if (!blob) return;
        storyFile = new File([blob], "adlarimiz-" + (d.id || "place") + ".png", { type: "image/png" });
        if (storyUrl) URL.revokeObjectURL(storyUrl);
        storyUrl = URL.createObjectURL(blob);
        img.src = storyUrl; img.hidden = false;
        sdlg.querySelector(".st-wait").hidden = true;
        sb.disabled = false; db.disabled = false;
        sdlg.dataset.ready = "1";
      });
    }
    sdlg.querySelector(".st-share").onclick = function () {
      if (!storyFile) return;
      navigator.share({ files: [storyFile], title: current && current.title, text: current && current.url }).catch(function () {});
    };
    sdlg.querySelector(".st-dl").onclick = function () {
      if (!storyUrl) return;
      var a = document.createElement("a"); a.href = storyUrl; a.download = storyFile.name; document.body.appendChild(a); a.click(); a.remove();
    };
    window.__adlarimizStory = { make: makeStory };

    // ---- data for a place (read from its popup) ----
    function placeData(pop) {
      var fix = pop.querySelector("[data-fix]"); if (!fix) return null;
      var id = fix.getAttribute("data-fix");
      var orig = (pop.querySelector("h4") || {}).textContent || "";
      var faEl = pop.querySelector(".fa"); var fa = faEl ? faEl.textContent.trim() : "";
      var pEl = pop.querySelector(":scope > p"); var desc = pEl ? pEl.textContent.trim() : "";
      var t = s(), title = t.place(orig.trim(), fa);
      if (desc.length > 220) desc = desc.slice(0, 217).replace(/\s+\S*$/, "") + "…";
      var url = SITE + "?place=" + enc(id);
      return { id: id, title: title, text: title + (desc ? "\n" + desc : ""), short: title, url: url, tags: t.tags, heading: orig.trim(), story: storyInfo(pop) };
    }
    function siteData() {
      var t = s();
      return { title: document.title, text: t.site, short: t.site, url: SITE, tags: t.tags, heading: t.shareSite };
    }

    // ---- "Share" button in every place popup ----
    function addToPopup(pop) {
      if (pop.querySelector(".share-btn")) return;
      var fix = pop.querySelector(".fix-btn"); if (!fix) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn share-btn"; b.textContent = "↗ " + s().share;
      b.onclick = function (e) { e.stopPropagation(); var d = placeData(pop); if (d) openShare(d); };
      fix.insertAdjacentElement("beforebegin", b);
    }
    if (window.__popupHooks) window.__popupHooks.push(addToPopup);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        if (n.matches && n.matches(".pop")) addToPopup(n);
        if (n.querySelectorAll) n.querySelectorAll(".pop").forEach(addToPopup);
      }); });
    }).observe(document.body, { childList: true, subtree: true });

    // ---- "Share the site" button in the header ----
    var hb = document.getElementById("share-site");
    var label = function () { hb.title = s().shareSite; hb.setAttribute("aria-label", s().shareSite); hb.querySelector("span").textContent = s().share; };
    hb.onclick = function () { openShare(siteData()); };
    label();
    new MutationObserver(label).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });

    // ---- keep the shared place open: reopen its popup after a language change ----
    function reopen(tries) {
      var m = /place=([^&]+)/.exec(location.hash); if (!m) return;
      tries = tries || 0;
      // the old popup fades out first; wait for it to disappear
      if (document.querySelector(".leaflet-popup")) { if (tries < 15) setTimeout(function () { reopen(tries + 1); }, 100); return; }
      var id = decodeURIComponent(m[1]);
      if (window.__adlarimizFocus) { window.__adlarimizFocus(id); return; }
      var item = document.querySelector('.item[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (item) item.click();
    }
    window.__adlarimizReopen = reopen;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.addEventListener("pointerdown", function () { b._hadPopup = !!document.querySelector(".leaflet-popup"); }, true);
      b.addEventListener("click", function (e) { if (b._hadPopup || !e.isTrusted) setTimeout(reopen, 120); b._hadPopup = false; });
    });
    // forget the place in the address when its popup is closed
    document.addEventListener("click", function (e) {
      if (e.target.closest(".leaflet-popup-close-button")) history.replaceState(null, "", location.pathname + location.search.replace(/([?&])place=[^&]*&?/, "$1").replace(/[?&]$/, ""));
    });
  })();

})();
</script>
<!-- ===== Admin panel (hidden; open with 5 quick taps on the logo or Ctrl+Shift+Y) ===== -->
<section id="admin-view" hidden>
  <header class="topbar"><div class="adm-brand"><div class="title">Adlarımız — Admin</div><div class="sub">Review community suggestions</div></div><button type="button" id="adm-close" class="adm-close">← Site</button></header>
  <div class="adm-wrap">
    <div class="adm-bar">
      <input id="adm-key" type="password" placeholder="ADMIN_KEY" autocomplete="current-password">
      <button class="btn primary" id="adm-load">Load</button>
      <span style="flex:1"></span>
      <button class="chip active" data-f="pending">Pending</button>
      <button class="chip" data-f="approved">Approved</button>
      <button class="chip" data-f="rejected">Rejected</button>
      <button class="chip" data-f="all">All</button>
      <button class="btn ghost" id="adm-export" title="Seed + approved, in data/places.js format">Export places.js</button>
    </div>
    <p id="adm-status" class="meta"></p>
    <div id="adm-rows"></div>
  </div>
</section>
<script>
/* ===== Admin panel logic ===== */
(function () {
  "use strict";
  const URL_ = (window.SITE_CONFIG || {}).APPS_SCRIPT_URL;
  const TYPES = ["city", "village", "region", "mountain", "river", "lake", "island", "landmark", "square", "other"];
  const FIELDS = [
    ["originalLatin", "Original Turkish (Latin)"], ["originalArabic", "Original (Arabic script)", "rtl"],
    ["persianFa", "Persian name", "rtl"], ["persianLatin", "Persian name (Latin)"],
    ["province", "Province"], ["period", "Period"],
    ["description", "Description / reason (as submitted — not shown publicly for corrections)", "", true], ["descEn", "Description EN", "", true],
    ["descTr", "Description TR", "", true], ["descAz", "Description AZ", "", true], ["descFa", "Description FA", "rtl", true], ["source", "Source URL(s), space separated", "", true]
  ];
  let rows = [], filter = "pending";
  const root = document.getElementById("admin-view");
  const $ = (s) => root.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const status = (m) => { $("#adm-status").textContent = m; };

  try { $("#adm-key").value = sessionStorage.getItem("adminKey") || ""; } catch (e) {}

  async function api(body) {
    if (!URL_) throw new Error("APPS_SCRIPT_URL is empty in config.js");
    body.key = $("#adm-key").value.trim();
    const r = await fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "error");
    return j;
  }

  async function load() {
    try { sessionStorage.setItem("adminKey", $("#adm-key").value.trim()); } catch (e) {}
    status("Loading…");
    try { rows = (await api({ action: "admin_list" })).items.reverse(); render(); }
    catch (e) { status("Error: " + e.message); }
  }

  const SEED = Array.isArray(window.SEED_PLACES) ? window.SEED_PLACES : [];
  function fixBanner(r) {
    const s = SEED.find((p) => p.id === r.refId);
    if (!s) return `<div class="fixb">✎ Correction for <b>${esc(r.refId)}</b> (not in seed list — maybe an approved user entry)</div>`;
    const cmp = [["Original", s.original.latin, r.originalLatin], ["Arabic", s.original.arabic, r.originalArabic], ["Persian", s.persian.fa, r.persianFa], ["Persian (Latin)", s.persian.latin, r.persianLatin], ["Type", s.type, r.type], ["Province", s.province, r.province], ["Period", s.period, r.period]]
      .filter(([, o, n]) => String(o || "") !== String(n || ""))
      .map(([k, o, n]) => `<div>${k}: <s>${esc(o)}</s> → <b>${esc(n)}</b></div>`).join("") || "<div>No name/field changes — see the reason below.</div>";
    return `<div class="fixb">✎ Correction for <b>${esc(s.original.latin)}</b> (${esc(r.refId)})${cmp}</div>`;
  }

  function render() {
    const list = rows.filter((r) => filter === "all" || r.status === filter);
    status(`${list.length} shown · ${rows.filter((r) => r.status === "pending").length} pending · ${rows.length} total`);
    $("#adm-rows").innerHTML = list.map((r) => `
      <div class="card ${esc(r.status)}" data-id="${esc(r.id)}">
        <div>
          ${r.refId ? fixBanner(r) : ""}
          <div class="meta"><span class="st">${esc(r.status)}</span> · ${esc(r.id)} · ${esc(r.createdAt)} · ${esc(r.nickname || "anonymous")} · lang ${esc(r.lang)}</div>
          <div class="grid">
            ${FIELDS.map(([k, label, dir, full]) => `<label class="${full ? "full" : ""}">${label}
              ${full ? `<textarea name="${k}" rows="2" ${dir ? 'dir="rtl"' : ""}>${esc(r[k])}</textarea>` : `<input name="${k}" value="${esc(r[k])}" ${dir ? 'dir="rtl"' : ""}>`}</label>`).join("")}
            <label>Type<select name="type">${TYPES.map((t) => `<option ${t === r.type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
            <label>Name status<select name="placeStatus"><option value="changed" ${r.placeStatus !== "restored" ? "selected" : ""}>changed</option><option value="restored" ${r.placeStatus === "restored" ? "selected" : ""}>restored</option></select></label>
            <label>Reliability<select name="confidence">${["", "high", "medium", "low"].map((c) => `<option value="${c}" ${c === (r.confidence || "") ? "selected" : ""}>${c || "(auto)"}</option>`).join("")}</select></label>
            <label>Correction of (refId)<input name="refId" value="${esc(r.refId)}" placeholder="empty = new place"></label>
            <label>Lat<input name="lat" value="${esc(r.lat)}"></label>
            <label>Lng<input name="lng" value="${esc(r.lng)}"></label>
          </div>
          <div class="btns">
            <button class="btn ok" data-act="approved">Approve</button>
            <button class="btn no" data-act="rejected">Reject</button>
            <button class="btn ghost" data-act="save">Save edits</button>
            <button class="btn ghost" data-act="pending">Back to pending</button>
          </div>
        </div>
        <div class="mini" id="adm-m-${esc(r.id)}"></div>
      </div>`).join("");
    list.forEach((r) => {
      const lat = +r.lat, lng = +r.lng;
      if (!isFinite(lat)) return;
      const m = L.map("adm-m-" + r.id, { zoomControl: false, attributionControl: false }).setView([lat, lng], 11);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}").addTo(m);
      L.marker([lat, lng]).addTo(m);
    });
  }

  $("#adm-rows").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const card = b.closest(".card"), id = card.dataset.id, act = b.dataset.act;
    const fields = {};
    card.querySelectorAll("input,textarea,select").forEach((el) => { fields[el.name] = el.value; });
    b.disabled = true;
    try {
      await api({ action: "admin_update", id, status: act === "save" ? "" : act, fields });
      const r = rows.find((x) => x.id === id); Object.assign(r, fields); if (act !== "save") r.status = act;
      render();
    } catch (err) { alert("Error: " + err.message); b.disabled = false; }
  });

  root.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    filter = c.dataset.f;
    root.querySelectorAll(".chip").forEach((x) => x.classList.toggle("active", x === c));
    render();
  }));
  $("#adm-load").addEventListener("click", load);
  $("#adm-key").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

  // Export: seed + approved rows in data/places.js format (commit this to GitHub as a permanent backup)
  $("#adm-export").addEventListener("click", async () => {
    const seed = Array.isArray(window.SEED_PLACES) ? window.SEED_PLACES : [];
    const map = new Map(seed.map((p) => [p.id, p]));
    rows.filter((r) => r.status === "approved").forEach((r) => {
      const d = r.description || "";
      const key = r.refId || r.id;
      const base = map.get(key);
      const d0 = r.refId ? "" : d;
      if (base) {
        const k = (a, b) => (b !== undefined && b !== null && String(b) !== "" ? b : a);
        map.set(key, Object.assign({}, base, {
          type: k(base.type, r.type), status: r.placeStatus === "restored" ? "restored" : base.status,
          lat: +k(base.lat, r.lat), lng: +k(base.lng, r.lng),
          original: { latin: k(base.original.latin, r.originalLatin), arabic: k(base.original.arabic, r.originalArabic) },
          persian: { fa: k(base.persian.fa, r.persianFa), latin: k(base.persian.latin, r.persianLatin) },
          province: k(base.province, r.province), period: k(base.period, r.period),
          desc: { en: k(base.desc.en, r.descEn), tr: k(base.desc.tr, r.descTr), az: k(base.desc.az, r.descAz), fa: k(base.desc.fa, r.descFa) },
          sources: Array.from(new Set([].concat(base.sources || [], String(r.source || "").split(/\s+/).filter((u) => /^https?:\/\//.test(u))))),
          confidence: k(base.confidence, r.confidence)
        }));
        return;
      }
      map.set(key, {
        id: r.id, type: r.type, status: r.placeStatus === "restored" ? "restored" : "changed",
        lat: +r.lat, lng: +r.lng,
        original: { latin: r.originalLatin, arabic: r.originalArabic },
        persian: { fa: r.persianFa, latin: r.persianLatin },
        province: r.province, period: r.period,
        desc: { en: r.descEn || d0, tr: r.descTr || d0, az: r.descAz || d0, fa: r.descFa || d0 }, confidence: r.confidence || "low",
        sources: String(r.source || "").split(/\s+/).filter((u) => /^https?:\/\//.test(u))
      });
    });
    const js = "// Başlangıç listesi / seed list. Admin panelindeki \"Export places.js\" ile güncellenir.\nwindow.SEED_PLACES = " + JSON.stringify(Array.from(map.values()), null, 2) + ";\n";
    const blob = new Blob([js], { type: "text/javascript" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "places.js"; a.click();
  });

  // ---------- hidden entry: 5 quick taps on the logo/title, or Ctrl+Shift+Y ----------
  function openAdmin() {
    root.hidden = false; document.body.classList.add("admin-open");
    setTimeout(function () { var k = $("#adm-key"); if (k && !k.value) k.focus(); }, 50);
  }
  function closeAdmin() { root.hidden = true; document.body.classList.remove("admin-open"); }
  $("#adm-close").addEventListener("click", closeAdmin);
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === "Y" || e.key === "y")) { e.preventDefault(); root.hidden ? openAdmin() : closeAdmin(); }
    else if (e.key === "Escape" && !root.hidden && !document.querySelector("dialog[open]")) closeAdmin();
  });
  let taps = [];
  document.querySelector(".topbar .brand").addEventListener("click", () => {
    const now = Date.now();
    taps = taps.filter((t) => now - t < 2500); taps.push(now);
    if (taps.length >= 5) { taps = []; openAdmin(); }
  });
})();
</script>
</body>
