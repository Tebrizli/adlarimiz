<style>
/* ===== Mobile list sheet: close button + fit above keyboard ===== */
.sheet-close{display:none}
@media (max-width:760px){
  .search-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .search-wrap #search{flex:1;min-width:0}
  .search-wrap #geo-search{flex-basis:100%}

  .sidebar{height:min(55vh, var(--vvh, 100vh) - 70px);max-height:calc(var(--vvh, 100vh) - 70px)}
  .sidebar::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#cfd6de;margin:8px auto 0}
}
/* ===== automatic translation under a suggestion ===== */
.mt-box{margin:-2px 0 8px;padding:7px 10px;border-inline-start:3px solid var(--blue);background:#f2f9fc;border-radius:0 6px 6px 0}
.mt-box .mt-label{font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.mt-box .mt-text{font-size:.86rem;line-height:1.45;color:var(--ink)}
/* ===== info popup: fits the screen, content scrolls with a finger ===== */
.leaflet-container .leaflet-popup-content{min-width:0;max-width:min(320px, calc(100vw - 72px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.leaflet-container .leaflet-popup-content-wrapper{max-width:calc(100vw - 40px)}
.leaflet-container .leaflet-popup-scrolled{border-top:0;border-bottom:0}
/* ===== sharing ===== */
.share-site{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #2b4c7e;color:#cfe3f7;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
.share-site:hover{background:var(--navy-2);color:#fff}
@media (max-width:760px){ .share-site span{display:none} .share-site{padding:7px 9px} }
.pop .share-btn{margin-top:10px;width:100%;background:var(--red);color:#fff;border:1px solid var(--red);padding:6px 10px;font-size:.85rem}
.pop .share-btn + .fix-btn{margin-top:6px}
#share-dlg{border:0;border-radius:14px;padding:0;width:min(440px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
#share-dlg::backdrop{background:rgba(11,37,69,.45)}
#share-dlg .sh-wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#share-dlg .sh-head{display:flex;align-items:center;gap:10px}
#share-dlg .sh-title{margin:0;flex:1;color:var(--navy);font-size:1.1rem}
#share-dlg .sh-x{border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem}
#share-dlg .sh-preview{margin:0;font-size:.85rem;color:var(--muted);white-space:pre-line;max-height:7.5em;overflow:auto;background:var(--bg);border-radius:8px;padding:8px 10px}
#share-dlg .sh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#share-dlg .sh-net{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;color:#fff;font-weight:700;font-size:.82rem;text-decoration:none;text-align:center;padding:4px}
#share-dlg .sh-net:hover{filter:brightness(1.1)}
#share-dlg .sh-copy{display:flex;gap:8px}
#share-dlg .sh-url{flex:1;min-width:0;font:inherit;font-size:.82rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;direction:ltr}
#share-dlg .sh-native{width:100%}
@media (max-width:420px){ #share-dlg .sh-grid{grid-template-columns:repeat(2,1fr)} }

<script>
/* Popup defaults (set before app.js creates any popup):
   limited height so long content scrolls inside it, and kept clear of the map buttons on phones */
(function () {
  if (!window.L || !L.Popup) return;
  var w = window.innerWidth, h = window.innerHeight, small = w <= 760;
  L.Popup.mergeOptions({
    maxHeight: Math.round(small ? Math.min(h * 0.5, h - 330) : h * 0.7),
    autoPanPaddingTopLeft: L.point(small ? 8 : 12, small ? 84 : 12),
    autoPanPaddingBottomRight: L.point(small ? 8 : 12, small ? 90 : 24),
    keepInView: true
  });
  // let index.html add its own buttons to a popup BEFORE Leaflet measures and positions it
  window.__popupHooks = [];
  var origUpdate = L.Popup.prototype._updateContent;
  L.Popup.prototype._updateContent = function () {
    origUpdate.apply(this, arguments);
    var n = this._contentNode;
    if (!n) return;
    n.__popup = this;
    var pop = n.querySelector(".pop");
    if (pop) window.__popupHooks.forEach(function (f) { try { f(pop); } catch (e) {} });
  };
  // re-fit a popup whose content grew later (e.g. a translation arrived)
  window.__refitPopup = function (el) {
    var n = el && el.closest && el.closest(".leaflet-popup-content"), lp = n && n.__popup;
    if (!lp || !lp._map) return;
    try { lp._updateLayout(); lp._updatePosition(); lp._adjustPan(); } catch (e) {}
  };
})();
</script>

<script>
/* ===== Runs BEFORE app.js: choose the start language =====
   Priority: ?lang=  >  language the visitor clicked in this browser session  >  language from country (IP)
   The country result is cached so the right language appears immediately on later visits. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var manual = sessionStorage.getItem("langManual");
    var geo = localStorage.getItem("geoLang");
    if (!q) localStorage.setItem("lang", manual || geo || "en");
  } catch (e) {}
  // shared links use ?place=ID (survives every social network); app.js opens #place=ID
  try {
    var sp = new URLSearchParams(location.search), pl = sp.get("place");
    if (pl && !/place=/.test(location.hash)) {
      sp.delete("place");
      var qs = sp.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + "#place=" + encodeURIComponent(pl));
    }
  } catch (e) {}
})();
</script>
<script src="assets/app.js"></script>
<script>
/* ======================================================================
   Extras kept inside index.html:
   1) language by visitor's country (IP)   2) closable mobile list sheet
   3) suggestions: original text + automatic translation below it
   Add ?debug=1 to the address to see a diagnostic panel.
   ====================================================================== */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var sidebar = $("#sidebar");
  var curLang = function () { return document.documentElement.lang || "en"; };
  var DEBUG = /[?&]debug=1/.test(location.search);
  var dbgBox = null;
  function log() {
    var msg = Array.prototype.slice.call(arguments).join(" ");
    try { console.info("[Adlarimiz]", msg); } catch (e) {}
    if (!DEBUG) return;
    if (!dbgBox) {
      dbgBox = document.createElement("div");
      dbgBox.style.cssText = "position:fixed;z-index:3000;left:8px;bottom:8px;max-width:min(520px,94vw);max-height:40vh;overflow:auto;background:#111;color:#9f9;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;opacity:.92;white-space:pre-wrap";
      document.body.appendChild(dbgBox);
    }
    dbgBox.textContent += msg + "\n";
  }
  function getJSON(url, ms) {
    var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, ms || 3500);
    return fetch(url, { signal: c.signal, cache: "no-store" })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) { try { return JSON.parse(txt); } catch (e) { return txt; } });
  }

  /* ---------- 1) Language by visitor's country ---------- */
  (function () {
    var LANG_BY_COUNTRY = { TR: "tr", AZ: "az", IR: "fa" };
    var LANG_BY_TZ = { "Europe/Istanbul": "tr", "Asia/Istanbul": "tr", "Asia/Baku": "az", "Asia/Tehran": "fa" };
    var userClicked = false;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.addEventListener("click", function (e) {
        if (!e.isTrusted) return;                                        // ignore our own programmatic clicks
        userClicked = true;
        try { sessionStorage.setItem("langManual", b.dataset.lang); } catch (x) {}
      });
    });
    var manual = null; try { manual = sessionStorage.getItem("langManual"); } catch (e) {}
    if (new URLSearchParams(location.search).get("lang") || manual) { log("lang: manual/URL choice kept ->", curLang()); return; }

    function apply(lang, why) {
      lang = lang || "en";
      try { localStorage.setItem("geoLang", lang); } catch (e) {}
      log("lang: " + why + " -> " + lang);
      if (userClicked || lang === curLang()) return;
      var btn = document.querySelector('.langs button[data-lang="' + lang + '"]');
      if (btn) { btn.click(); setTimeout(function () { if (window.__adlarimizReopen) window.__adlarimizReopen(); }, 150); }
    }
    var PROVIDERS = [
      ["country.is", "https://api.country.is/", function (j) { return j.country; }],
      ["geojs", "https://get.geojs.io/v1/ip/country.json", function (j) { return j.country; }],
      ["ipapi.co", "https://ipapi.co/country/", function (j) { return String(j).trim(); }],
      ["ipwho.is", "https://ipwho.is/?fields=country_code", function (j) { return j.country_code; }],
      ["cloudflare", "https://www.cloudflare.com/cdn-cgi/trace", function (t) { var m = /loc=([A-Z]{2})/.exec(String(t)); return m && m[1]; }]
    ];
    (function next(i) {
      if (i >= PROVIDERS.length) {
        var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
        return apply(LANG_BY_TZ[tz] || "en", "all IP services failed, time zone " + tz);
      }
      var p = PROVIDERS[i];
      getJSON(p[1]).then(function (j) {
        var cc = p[2](j); if (!cc || !/^[A-Za-z]{2}$/.test(cc)) throw new Error("no country in answer");
        cc = cc.toUpperCase();
        apply(LANG_BY_COUNTRY[cc] || "en", "country " + cc + " via " + p[0]);
      }).catch(function (err) { log("geo: " + p[0] + " failed (" + (err && err.message || err) + ")"); next(i + 1); });
    })(0);
  })();

  /* ---------- 2) Mobile: closable list sheet ---------- */
  (function () {
    var close = function () { sidebar.classList.remove("open"); var s = $("#search"); if (s) s.blur(); };
    $("#sheet-close").addEventListener("click", close);
    $(".map-wrap").addEventListener("pointerdown", function (e) {
      if (sidebar.classList.contains("open") && !e.target.closest("#toggle-list")) close();
    }, true);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    $("#search").addEventListener("keydown", function (e) { if (e.key === "Enter" && window.innerWidth <= 760) e.target.blur(); });
    var setVvh = function () { var h = window.visualViewport ? window.visualViewport.height : window.innerHeight; document.documentElement.style.setProperty("--vvh", h + "px"); };
    setVvh();
    if (window.visualViewport) window.visualViewport.addEventListener("resize", setVvh);
    window.addEventListener("resize", setVvh);
  })();

  /* ---------- 3) Suggestions: keep the original, add a translation under it ---------- */
  (function () {
    var LABEL = { en: "Automatic translation", tr: "Otomatik çeviri", az: "Avtomatik tərcümə", fa: "ترجمهٔ خودکار" };
    var LOADING = { en: "Translating…", tr: "Çevriliyor…", az: "Tərcümə edilir…", fa: "در حال ترجمه…" };
    var WORDS = {
      en: ["the","and","of","was","is","to","in","by","from","its","were","which","after","renamed","name","called","village","town","city","officially","locals","still"],
      tr: ["ve","ile","olarak","için","yapıldı","edildi","değiştirildi","oldu","değil","hâlâ","şimdi","yerel","resmî","resmen","şehir","köy","adını","adıyla","eski","halk","yerine"],
      az: ["və","ilə","kimi","üçün","edilib","olub","adlanır","adlandırılıb","dəyişdirilib","deyil","hələ","indi","yerli","rəsmi","şəhər","kənd","köhnə","xalq","əvəzinə"]
    };
    var cache = {};
    try { cache = JSON.parse(localStorage.getItem("mtCache2") || "{}"); } catch (e) {}
    var save = function () { try { localStorage.setItem("mtCache2", JSON.stringify(cache)); } catch (e) {} };

    function guess(text) {
      var ar = (text.match(/[؀-ۿ]/g) || []).length, lat = (text.match(/[A-Za-zÀ-žəƏ]/g) || []).length;
      if (ar > lat) return "fa";
      var w = text.toLocaleLowerCase("tr").replace(/[^\p{L}\s]/gu, " ").split(/\s+/);
      var best = null, bestN = 0, second = 0;
      Object.keys(WORDS).forEach(function (l) {
        var n = 0; w.forEach(function (x) { if (WORDS[l].indexOf(x) > -1) n++; });
        if (n > bestN) { second = bestN; bestN = n; best = l; } else if (n > second) second = n;
      });
      if (bestN >= 1 && bestN > second) return best;
      if (/[əƏ]/.test(text)) return "az";
      if (/[ıİşŞğĞ]/.test(text)) return "tr";
      return null;
    }

    // Several free, key-less translators; the first that answers wins.
    var TRANSLATORS = [
      ["google", function (text, tl) {
        return getJSON("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + tl + "&dt=t&q=" + encodeURIComponent(text), 6000)
          .then(function (j) { return { text: (j[0] || []).map(function (s) { return s[0]; }).join(""), from: j[2] }; });
      }],
      ["google-dict", function (text, tl) {
        return getJSON("https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=" + tl + "&q=" + encodeURIComponent(text), 6000)
          .then(function (j) {
            var first = Array.isArray(j) ? j[0] : null;
            if (Array.isArray(first)) return { text: first[0], from: first[1] };
            if (typeof first === "string") return { text: first, from: null };
            if (j && j.sentences) return { text: j.sentences.map(function (s) { return s.trans || ""; }).join(""), from: j.src };
            throw new Error("unexpected answer");
          });
      }],
      ["lingva", function (text, tl, g) {
        return getJSON("https://lingva.ml/api/v1/auto/" + tl + "/" + encodeURIComponent(text), 7000)
          .then(function (j) { return { text: j.translation, from: j.info && j.info.detectedSource }; });
      }],
      ["mymemory", function (text, tl, g) {
        return getJSON("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text.slice(0, 480)) + "&langpair=" + (g || "en") + "|" + tl, 7000)
          .then(function (j) { if (!j || !j.responseData || Number(j.responseStatus) !== 200) throw new Error("status " + (j && j.responseStatus)); return { text: j.responseData.translatedText, from: g }; });
      }]
    ];

    function translate(text, tl) {
      var key = tl + "|" + text;
      if (Object.prototype.hasOwnProperty.call(cache, key)) return Promise.resolve(cache[key]);
      var g = guess(text);
      return (function next(i) {
        if (i >= TRANSLATORS.length) { log("translate: all services failed"); return Promise.resolve(undefined); }
        var tr = TRANSLATORS[i];
        return tr[1](text, tl, g).then(function (r) {
          if (!r || !r.text) throw new Error("empty");
          log("translate: ok via " + tr[0] + " (from " + (r.from || g || "?") + " to " + tl + ")");
          var same = (r.from && String(r.from).slice(0, 2) === tl) || r.text.trim() === text.trim();
          var res = same ? null : r.text;                                  // null = text already in this language
          cache[key] = res; save(); return res;
        }).catch(function (err) { log("translate: " + tr[0] + " failed (" + (err && err.message || err) + ")"); return next(i + 1); });
      })(0);
    }

    function handlePopup(pop) {
      if (pop.dataset.mtDone) return;
      pop.dataset.mtDone = "1";
      if (!pop.querySelector(".tag.user")) return;                       // only community suggestions
      var p = pop.querySelector(":scope > p");
      if (!p) return;
      var text = p.textContent.trim(), tl = curLang();
      if (text.length < 3) return;
      if (guess(text) === tl) { log("translate: text already looks " + tl + ", skipped"); return; }
      var box = document.createElement("div");
      box.className = "mt-box"; box.setAttribute("dir", tl === "fa" ? "rtl" : "ltr");
      box.innerHTML = '<div class="mt-label"></div><div class="mt-text"></div>';
      box.querySelector(".mt-label").textContent = "↳ " + (LABEL[tl] || LABEL.en);
      box.querySelector(".mt-text").textContent = LOADING[tl] || LOADING.en;
      p.insertAdjacentElement("afterend", box);
      p.setAttribute("dir", "auto");
      setTimeout(function () { if (window.__refitPopup) window.__refitPopup(box); }, 0);
      translate(text, tl).then(function (res) {
        if (!box.isConnected) return;
        if (!res) { var parent = box.parentNode; box.remove(); if (window.__refitPopup) window.__refitPopup(parent); return; }
        box.querySelector(".mt-text").textContent = res;
        if (window.__refitPopup) window.__refitPopup(box);
      });
    }

    function scan(root) {
      if (!root.querySelectorAll) return;
      if (root.matches && root.matches(".pop")) handlePopup(root);
      root.querySelectorAll(".pop").forEach(handlePopup);
    }
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
  })();

  /* ---------- 4) Sharing: places and the whole site ---------- */
  (function () {
    var SITE = "https://tebrizli.github.io/adlarimiz/";
    var S = {
      en: { share: "Share", shareSite: "Share the site", shareTitle: "Share", copy: "Copy link", copied: "Link copied ✓", more: "More…", close: "Close",
            place: function (o, f) { return o + " → " + f + ": an erased Turkic place name of South Azerbaijan"; },
            site: "Adlarımız — the Turkic place names of South Azerbaijan that were replaced with Persian names. Explore the map and help document them.",
            tags: ["Adlarımız", "SouthAzerbaijan"] },
      tr: { share: "Paylaş", shareSite: "Siteyi paylaş", shareTitle: "Paylaş", copy: "Bağlantıyı kopyala", copied: "Bağlantı kopyalandı ✓", more: "Diğer…", close: "Kapat",
            place: function (o, f) { return o + " → " + f + ": Güney Azerbaycan'da silinen bir Türkçe yer adı"; },
            site: "Adlarımız — Güney Azerbaycan'da Farsça adlarla değiştirilen Türkçe yer adları haritası. Keşfedin ve belgelemeye katkı verin.",
            tags: ["Adlarımız", "GüneyAzerbaycan"] },
      az: { share: "Paylaş", shareSite: "Saytı paylaş", shareTitle: "Paylaş", copy: "Keçidi kopyala", copied: "Keçid kopyalandı ✓", more: "Digər…", close: "Bağla",
            place: function (o, f) { return o + " → " + f + ": Güney Azərbaycanda silinən türk yer adı"; },
            site: "Adlarımız — Güney Azərbaycanda fars adları ilə əvəz edilən türk yer adlarının xəritəsi. Kəşf edin və sənədləşdirməyə qoşulun.",
            tags: ["Adlarımız", "GüneyAzərbaycan"] },
      fa: { share: "اشتراک‌گذاری", shareSite: "اشتراک سایت", shareTitle: "اشتراک‌گذاری", copy: "کپی پیوند", copied: "پیوند کپی شد ✓", more: "بیشتر…", close: "بستن",
            place: function (o, f) { return o + " ← " + f + ": نام ترکیِ تغییر داده شده در آذربایجان جنوبی"; },
            site: "آدلاریمیز — نقشهٔ نام‌های ترکی آذربایجان جنوبی که با نام‌های فارسی جایگزین شده‌اند. نقشه را ببینید و در مستندسازی سهیم شوید.",
            tags: ["آدلاریمیز", "آذربایجان_جنوبی"] }
    };
    var s = function () { return S[curLang()] || S.en; };
    var enc = encodeURIComponent;

    var NETWORKS = [
      ["WhatsApp", "#25D366", function (d) { return "https://wa.me/?text=" + enc(d.text + "\n" + d.url); }],
      ["Telegram", "#229ED9", function (d) { return "https://t.me/share/url?url=" + enc(d.url) + "&text=" + enc(d.text); }],
      ["X", "#111111", function (d) { return "https://twitter.com/intent/tweet?text=" + enc(d.short) + "&url=" + enc(d.url) + "&hashtags=" + enc(d.tags.join(",")); }],
      ["Facebook", "#1877F2", function (d) { return "https://www.facebook.com/sharer/sharer.php?u=" + enc(d.url); }],
      ["LinkedIn", "#0A66C2", function (d) { return "https://www.linkedin.com/sharing/share-offsite/?url=" + enc(d.url); }],
      ["Reddit", "#FF4500", function (d) { return "https://www.reddit.com/submit?url=" + enc(d.url) + "&title=" + enc(d.title); }],
      ["VK", "#0077FF", function (d) { return "https://vk.com/share.php?url=" + enc(d.url) + "&title=" + enc(d.title); }],
      ["E-mail", "#6B7785", function (d) { return "mailto:?subject=" + enc(d.title) + "&body=" + enc(d.text + "\n\n" + d.url); }]
    ];

    // ---- dialog ----
    var dlg = document.createElement("dialog");
    dlg.id = "share-dlg";
    dlg.innerHTML = '<div class="sh-wrap"><div class="sh-head"><h3 class="sh-title"></h3><button type="button" class="sh-x" aria-label="Close">✕</button></div>' +
      '<p class="sh-preview"></p><div class="sh-grid"></div>' +
      '<div class="sh-copy"><input class="sh-url" readonly><button type="button" class="btn primary sh-copybtn"></button></div>' +
      '<button type="button" class="btn ghost sh-native" hidden></button></div>';
    document.body.appendChild(dlg);
    var current = null;
    dlg.querySelector(".sh-x").onclick = function () { dlg.close(); };
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

    function openShare(d) {
      current = d;
      var t = s();
      dlg.setAttribute("dir", curLang() === "fa" ? "rtl" : "ltr");
      dlg.querySelector(".sh-title").textContent = d.heading || t.shareTitle;
      dlg.querySelector(".sh-preview").textContent = d.text;
      dlg.querySelector(".sh-url").value = d.url;
      dlg.querySelector(".sh-copybtn").textContent = t.copy;
      var grid = dlg.querySelector(".sh-grid"); grid.innerHTML = "";
      NETWORKS.forEach(function (n) {
        var a = document.createElement("a");
        a.className = "sh-net"; a.textContent = n[0]; a.style.background = n[1];
        a.href = n[2](d); a.target = "_blank"; a.rel = "noopener noreferrer";
        grid.appendChild(a);
      });
      var nat = dlg.querySelector(".sh-native");
      nat.hidden = !navigator.share; nat.textContent = "↗ " + t.more;
      if (!dlg.open) dlg.showModal();
    }
    dlg.querySelector(".sh-copybtn").onclick = function () {
      var b = this, url = current.url, done = function () { b.textContent = s().copied; setTimeout(function () { b.textContent = s().copy; }, 1800); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
      function fallback() { var i = dlg.querySelector(".sh-url"); i.select(); try { document.execCommand("copy"); done(); } catch (e) {} }
    };
    dlg.querySelector(".sh-native").onclick = function () {
      navigator.share({ title: current.title, text: current.text, url: current.url }).catch(function () {});
    };

    // ---- data for a place (read from its popup) ----
    function placeData(pop) {
      var fix = pop.querySelector("[data-fix]"); if (!fix) return null;
      var id = fix.getAttribute("data-fix");
      var orig = (pop.querySelector("h4") || {}).textContent || "";
      var faEl = pop.querySelector(".fa"); var fa = faEl ? faEl.textContent.trim() : "";
      var pEl = pop.querySelector(":scope > p"); var desc = pEl ? pEl.textContent.trim() : "";
      var t = s(), title = t.place(orig.trim(), fa);
      if (desc.length > 220) desc = desc.slice(0, 217).replace(/\s+\S*$/, "") + "…";
      var url = SITE + "?place=" + enc(id);
      return { title: title, text: title + (desc ? "\n" + desc : ""), short: title, url: url, tags: t.tags, heading: orig.trim() };
    }
    function siteData() {
      var t = s();
      return { title: document.title, text: t.site, short: t.site, url: SITE, tags: t.tags, heading: t.shareSite };
    }

    // ---- "Share" button in every place popup ----
    function addToPopup(pop) {
      if (pop.querySelector(".share-btn")) return;
      var fix = pop.querySelector(".fix-btn"); if (!fix) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn share-btn"; b.textContent = "↗ " + s().share;
      b.onclick = function (e) { e.stopPropagation(); var d = placeData(pop); if (d) openShare(d); };
      fix.insertAdjacentElement("beforebegin", b);
    }
    if (window.__popupHooks) window.__popupHooks.push(addToPopup);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) {
        if (n.nodeType !== 1) return;
        if (n.matches && n.matches(".pop")) addToPopup(n);
        if (n.querySelectorAll) n.querySelectorAll(".pop").forEach(addToPopup);
      }); });
    }).observe(document.body, { childList: true, subtree: true });

    // ---- "Share the site" button in the header ----
    var hb = document.getElementById("share-site");
    var label = function () { hb.title = s().shareSite; hb.setAttribute("aria-label", s().shareSite); hb.querySelector("span").textContent = s().share; };
    hb.onclick = function () { openShare(siteData()); };
    label();
    new MutationObserver(label).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });

    // ---- keep the shared place open: reopen its popup after a language change ----
    function reopen(tries) {
      var m = /place=([^&]+)/.exec(location.hash); if (!m) return;
      tries = tries || 0;
      // the old popup fades out first; wait for it to disappear
      if (document.querySelector(".leaflet-popup")) { if (tries < 15) setTimeout(function () { reopen(tries + 1); }, 100); return; }
      var id = decodeURIComponent(m[1]);
      var item = document.querySelector('.item[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (item) item.click();
    }
    window.__adlarimizReopen = reopen;
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.addEventListener("pointerdown", function () { b._hadPopup = !!document.querySelector(".leaflet-popup"); }, true);
      b.addEventListener("click", function (e) { if (b._hadPopup || !e.isTrusted) setTimeout(reopen, 120); b._hadPopup = false; });
    });
    // forget the place in the address when its popup is closed
    document.addEventListener("click", function (e) {
      if (e.target.closest(".leaflet-popup-close-button")) history.replaceState(null, "", location.pathname + location.search.replace(/([?&])place=[^&]*&?/, "$1").replace(/[?&]$/, ""));
    });
  })();

})();
</script>
