<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Adlarımız — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{display:block;overflow:auto}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .bar input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:280px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 260px;gap:14px}
  .card.approved{border-inline-start:4px solid var(--green)} .card.rejected{border-inline-start:4px solid #999;opacity:.75} .card.pending{border-inline-start:4px solid #e0a000}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:2px}
  .grid label.full{grid-column:1/-1}
  .grid input,.grid textarea,.grid select{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
  .mini{height:200px;border-radius:8px}
  .meta{font-size:.75rem;color:var(--muted);margin-bottom:6px}
  .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .btn.ok{background:var(--green);color:#fff;border-color:var(--green)} .btn.no{background:#fff;color:var(--red);border-color:var(--red)}
  .st{font-weight:700;text-transform:uppercase;font-size:.7rem}
  .fixb{background:#eef4fb;border:1px solid #d6e4f5;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.85rem;color:var(--navy)}
  .fixb s{color:var(--red)}
  @media(max-width:760px){.card{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div><div class="title">Adlarımız — Admin</div><div class="sub">Review community suggestions</div></div></div><a href="index.html" style="color:#cfe3f7">← Site</a></header>
<div class="wrap">
  <div class="bar">
    <input id="key" type="password" placeholder="ADMIN_KEY">
    <button class="btn primary" id="load">Load</button>
    <span style="flex:1"></span>
    <button class="chip active" data-f="pending">Pending</button>
    <button class="chip" data-f="approved">Approved</button>
    <button class="chip" data-f="rejected">Rejected</button>
    <button class="chip" data-f="all">All</button>
    <button class="btn ghost" id="export" title="Seed + approved, in data/places.js format">Export places.js</button>
  </div>
  <p id="status" class="meta"></p>
  <div id="rows"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="data/places.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
